      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt MicroservicesTaskRole.Arn
      ContainerDefinitions:
        - Name: notification-Cancelled-worker
          Image: 315224414670.dkr.ecr.ap-southeast-2.amazonaws.com/ecomm/notification-cancelled-worker:latest
