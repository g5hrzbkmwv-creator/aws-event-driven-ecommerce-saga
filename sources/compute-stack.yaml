              awslogs-stream-prefix: ecs

  # ==========================================
  # 6. ECS Services (常駐背景運行服務)
  # ==========================================
  OrderSuccessService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref MicroservicesCluster
      ServiceName: order-success-worker-service
      TaskDefinition: !Ref OrderSuccessTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!ImportValue ECommPublicSubnetId]
          SecurityGroups: [!ImportValue ECommOrderWorkerSgId]

  OrderFailedService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref MicroservicesCluster
      ServiceName: order-failed-worker-service
      TaskDefinition: !Ref OrderFailedTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!ImportValue ECommPublicSubnetId]
          SecurityGroups: [!ImportValue ECommOrderWorkerSgId]

  InventoryCreatedService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref MicroservicesCluster
      ServiceName: inventory-created-worker-service
      TaskDefinition: !Ref InventoryCreatedTaskDef
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!ImportValue ECommPublicSubnetId]
          SecurityGroups: [!ImportValue ECommInventoryWorkerSgId]

  InventoryFailedService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref MicroservicesCluster
