      ContainerDefinitions:
        - Name: notification-completed-worker
          Image: 315224414670.dkr.ecr.ap-southeast-2.amazonaws.com/ecomm/notification-completed-worker:latest
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref NotificationLogGroup
              awslogs-region: !Ref AWS::Region
